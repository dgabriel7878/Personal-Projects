name: Intraday paper trading

# The scheduled cron trigger is intentionally disabled. Real walk-forward
# validation (scripts/validate_strategy.py) showed both bidirectional
# intraday strategies (VWAP Mean Reversion, Intraday RSI Reversion) losing
# money out-of-sample on every tested ticker, with a re-entry whipsaw bug
# on top -- this should never have been scheduled live before that
# validation existed. Re-enable the `schedule:` trigger below only once a
# strategy has a real positive out-of-sample edge. Manual runs via
# workflow_dispatch (e.g. to smoke-test in --dry-run) still work.
on:
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run intraday trader
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          # Defaults to dry-run (safe) unless the repo variable DRY_RUN is
          # explicitly set to "false" -- Settings > Secrets and variables >
          # Actions > Variables, no code change/push needed to flip it.
          if [ "${{ vars.DRY_RUN }}" = "false" ]; then
            python scripts/run_intraday_trade.py --symbols AAPL MSFT SPY QQQ --strategy vwap
          else
            python scripts/run_intraday_trade.py --symbols AAPL MSFT SPY QQQ --strategy vwap --dry-run
          fi
